[build]
builder = "RAILPACK"

[deploy]
preDeployCommand = ["test -n \"$SUPERNOVA_DATABASE_URL\" && python -m alembic upgrade head"]
startCommand = "test -n \"$SUPERNOVA_DATABASE_URL\" && uvicorn backend.main:app --host 0.0.0.0 --port \"$PORT\""
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
