<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Panel administrativo de catálogo{% endblock %}</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #08070c;
    --bg-elevated: #11101a;
    --bg-sunken: #050509;
    --panel: #161521;
    --panel-strong: #1d1c2c;
    --border: #2a2939;
    --border-strong: #3c3a52;
    --fg: #f1f1f7;
    --fg-muted: #a4a3b9;
    --fg-faint: #6f6e85;
    --accent: #b48cff;
    --accent-strong: #cda4ff;
    --accent-ink: #0a0510;
    --success: #3df7a3;
    --success-ink: #062414;
    --warning: #ffb86b;
    --warning-ink: #2b1500;
    --error: #ff7a8a;
    --error-ink: #2b040b;
    --focus-ring: #ffd166;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.5;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  a:hover, a:focus-visible { color: var(--accent-strong); }
  code {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    font-size: 0.92em;
    background: var(--panel-strong);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
  }
  header.app-header {
    background: linear-gradient(180deg, #11101a 0%, #0a0914 100%);
    color: var(--fg);
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 18px;
    align-items: center;
    flex-wrap: wrap;
  }
  header.app-header .brand {
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    color: var(--fg);
    text-decoration: none;
  }
  header.app-header nav.primary {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  header.app-header nav.primary a {
    color: var(--fg-muted);
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid transparent;
  }
  header.app-header nav.primary a:hover,
  header.app-header nav.primary a:focus-visible {
    color: var(--fg);
    border-color: var(--border);
    background: var(--panel-strong);
  }
  header.app-header nav.primary a[aria-current="page"] {
    color: var(--fg);
    border-color: var(--accent);
    background: rgba(180, 140, 255, 0.08);
  }
  header.app-header .crumb {
    color: var(--fg-faint);
    font-size: 0.9rem;
  }
  main.app-main {
    padding: 24px;
    max-width: 1180px;
    margin: 0 auto;
  }
  h1, h2, h3 { margin: 0 0 0.6em; }
  h1 { font-size: 1.55rem; letter-spacing: -0.01em; }
  h2 { font-size: 1.15rem; margin-top: 1.6em; }
  h3 { font-size: 1rem; margin-top: 1.2em; }
  p.muted { color: var(--fg-muted); }
  p.faint { color: var(--fg-faint); font-size: 0.9rem; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    font-size: 0.95rem;
  }
  tbody tr:last-child td { border-bottom: none; }
  th {
    background: var(--panel-strong);
    font-weight: 600;
    color: var(--fg-muted);
    text-transform: uppercase;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
  }
  dl { margin: 0.6em 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
  dt { color: var(--fg-muted); font-weight: 600; }
  dd { margin: 0; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin: 14px 0;
  }
  .panel h2:first-child, .panel h3:first-child { margin-top: 0; }
  .panel.split {
    display: grid;
    gap: 18px;
    grid-template-columns: 1fr 1fr;
  }
  .empty {
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 22px;
    color: var(--fg-muted);
    background: var(--bg-elevated);
    text-align: center;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel-strong);
    color: var(--fg-muted);
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .badge::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--fg-faint);
  }
  .badge.success {
    color: var(--success);
    border-color: var(--success);
    background: rgba(61, 247, 163, 0.1);
  }
  .badge.success::before { background: var(--success); }
  .badge.warning {
    color: var(--warning);
    border-color: var(--warning);
    background: rgba(255, 184, 107, 0.12);
  }
  .badge.warning::before { background: var(--warning); }
  .badge.error {
    color: var(--error);
    border-color: var(--error);
    background: rgba(255, 122, 138, 0.12);
  }
  .badge.error::before { background: var(--error); }
  .badge.accent {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(180, 140, 255, 0.1);
  }
  .badge.accent::before { background: var(--accent); }
  .notice {
    border: 1px solid var(--border);
    border-left-width: 4px;
    padding: 12px 16px;
    border-radius: 8px;
    background: var(--bg-elevated);
    margin: 12px 0;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .notice.success { border-color: var(--success); border-left-color: var(--success); }
  .notice.error { border-color: var(--error); border-left-color: var(--error); }
  .notice .label {
    flex: 0 0 auto;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    padding-top: 2px;
  }
  .notice.success .label { color: var(--success); }
  .notice.error .label { color: var(--error); }
  .notice .body { color: var(--fg); }
  .form-grid {
    display: grid;
    gap: 14px;
    grid-template-columns: minmax(0, 1fr);
    margin-top: 8px;
  }
  label.form-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-weight: 600;
    color: var(--fg-muted);
    font-size: 0.92rem;
  }
  label.form-field .hint {
    font-weight: 400;
    color: var(--fg-faint);
    font-size: 0.85rem;
  }
  input[type="text"], input[type="number"], input[type="search"], select, textarea {
    background: var(--bg-sunken);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 0.98rem;
    font-family: inherit;
    width: 100%;
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--focus-ring);
  }
  input.invalid, select.invalid { border-color: var(--error); }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .checkbox-row label { color: var(--fg); font-weight: 500; font-size: 0.95rem; }
  .checkbox-row input[type="checkbox"] {
    accent-color: var(--accent);
    width: 18px;
    height: 18px;
  }
  button.primary, a.button.primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 9px 16px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    font-size: 0.95rem;
  }
  button.primary:hover, a.button.primary:hover,
  button.primary:focus-visible, a.button.primary:focus-visible {
    background: var(--accent-strong);
    border-color: var(--accent-strong);
    color: var(--accent-ink);
    outline: none;
  }
  button.secondary, a.button.secondary {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 8px 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    font-size: 0.9rem;
  }
  button.secondary:hover, a.button.secondary:hover,
  button.secondary:focus-visible, a.button.secondary:focus-visible {
    border-color: var(--accent);
    color: var(--accent-strong);
    outline: none;
  }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .pill-list {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 6px 0 0;
    padding: 0;
    list-style: none;
  }
  .pill-list li {
    background: var(--panel-strong);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.85rem;
  }
  .status-listener {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
    padding: 0;
    margin: -1px;
  }
  .nav-tree {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    gap: 8px;
  }
  .nav-tree .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    gap: 12px;
    min-width: 0;
  }
  .nav-tree .row .label { color: var(--fg); font-weight: 600; }
  .nav-tree .row .meta { color: var(--fg-faint); font-size: 0.85rem; }
  .nav-tree .row .row-body {
    min-width: 0;
    flex: 1 1 auto;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .nav-tree .row .row-action {
    flex: 0 0 auto;
    white-space: nowrap;
  }
  .nav-tree.nav-tree-allow-wrap .row {
    flex-wrap: wrap;
  }
  .nav-tree.nav-tree-allow-wrap .row .row-action {
    margin-left: auto;
  }

  .table-scroll {
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
  }
  .table-scroll > table {
    width: 100%;
    min-width: 36rem;
    border: 0;
    border-radius: 0;
    background: transparent;
    table-layout: auto;
  }
  .table-scroll th,
  .table-scroll td {
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .table-scroll th.actions-col,
  .table-scroll td.actions-col {
    white-space: nowrap;
    width: 1%;
  }
  .grid-2 {
    display: grid;
    gap: 18px;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
  }
  .stack { display: grid; gap: 12px; }
  .skip-link {
    position: absolute;
    left: -9999px;
    top: auto;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }
  .skip-link:focus {
    position: static;
    width: auto;
    height: auto;
    background: var(--accent);
    color: var(--accent-ink);
    padding: 8px 12px;
    display: inline-block;
    margin: 8px;
  }
  .visual-link {
    color: var(--accent);
    font-weight: 600;
  }
  @media (max-width: 800px) {
    main.app-main { padding: 16px; }
    header.app-header { padding: 12px 16px; }
    .grid-2 { grid-template-columns: 1fr; }
    .panel.split { grid-template-columns: 1fr; }
    table { font-size: 0.9rem; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main-content">Saltar al contenido</a>
<header class="app-header" role="banner">
  <a class="brand" href="/admin/catalog/comercios" aria-label="Panel administrativo de catálogo">Panel · Catálogo</a>
  <nav class="primary" aria-label="Navegación principal">
    <a href="/admin" {% if request.url.path == '/admin' or request.url.path == '/admin/' %}aria-current="page"{% endif %}>Inicio</a>
    <a href="/admin/catalog/comercios" {% if request.url.path.startswith('/admin/catalog/comercios') %}aria-current="page"{% endif %}>Comercios</a>
    <a href="/admin/catalog/medios-pago" {% if request.url.path.startswith('/admin/catalog/medios-pago') %}aria-current="page"{% endif %}>Medios de pago</a>
    <a href="/admin/pilot/orders" rel="noopener">Operación (panel piloto)</a>
  </nav>
  {% block crumb %}{% endblock %}
</header>
<main class="app-main" id="main-content" tabindex="-1">
{% block body %}{% endblock %}
</main>
<div class="status-listener" role="status" aria-live="polite" data-panel-status-labels>
  <span data-status-label-success>Listo</span>
  <span data-status-label-error>Error</span>
</div>
</body>
</html>
