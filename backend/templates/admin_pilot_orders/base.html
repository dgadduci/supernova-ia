<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Panel piloto de pedidos{% endblock %}</title>
<style>
  :root {
    --bg: #f7f7f8;
    --fg: #1d1f23;
    --muted: #6b7280;
    --accent: #1d4ed8;
    --border: #d8d8de;
    --panel: #ffffff;
    --warn: #b45309;
    --error: #b91c1c;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.45;
  }
  header {
    background: #1d1f23;
    color: #ffffff;
    padding: 12px 24px;
  }
  header a { color: inherit; text-decoration: none; }
  header .crumb { color: #cbd5e1; font-size: 0.85em; }
  main {
    padding: 16px 24px;
    max-width: 1280px;
    margin: 0 auto;
  }
  h1, h2, h3 { margin: 0.4em 0; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 1.4em; }
  h3 { font-size: 1.0rem; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  th, td {
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    font-size: 0.92rem;
  }
  th {
    background: #ececef;
    font-weight: 600;
  }
  dl { margin: 0.6em 0; }
  dt {
    font-weight: 600;
    color: var(--muted);
    margin-top: 0.4em;
  }
  dd { margin: 0 0 0.2em 0; }
  code { font-size: 0.85em; background: #ececef; padding: 1px 4px; border-radius: 3px; }
  .muted { color: var(--muted); }
  .notice {
    border: 1px solid var(--border);
    padding: 10px 14px;
    background: #fff8e6;
    border-radius: 4px;
    margin: 10px 0;
  }
  .empty {
    border: 1px dashed var(--border);
    padding: 14px;
    background: var(--panel);
    color: var(--muted);
    text-align: center;
  }
  .error {
    border: 1px solid var(--error);
    background: #fde8e8;
    padding: 10px 14px;
    border-radius: 4px;
    color: var(--error);
  }
  .warn { color: var(--warn); }
  .filters {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .filters label { display: block; margin: 6px 0; font-size: 0.9rem; }
  .filters input, .filters select {
    padding: 4px 6px;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 3px;
  }
  .filters button {
    padding: 6px 12px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    border-radius: 3px;
    cursor: pointer;
  }
  .pager { margin-top: 12px; display: flex; gap: 12px; align-items: center; }
  .pager .current { font-weight: 600; }
  .pager a {
    color: var(--accent);
    text-decoration: none;
  }
  .panel-section {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 16px;
    margin: 12px 0;
  }
  .outbound {
    border-left: 3px solid var(--accent);
    padding: 6px 10px;
    margin: 6px 0;
    background: #f4f6fb;
  }
  .outbound pre {
    white-space: pre-wrap;
    word-break: break-word;
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 8px;
    margin: 6px 0 0;
  }
  .receipt + .outbound { margin-left: 16px; }
  .debug-grid {
    display: grid;
    gap: 16px;
    grid-template-columns: minmax(16rem, 30%) minmax(16rem, 30%) minmax(20rem, 40%);
    align-items: start;
    margin: 16px 0;
  }
  .debug-column {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 16px;
    min-width: 0;
  }
  .debug-column h2 { margin-top: 0; }
  .debug-transcript {
    height: 12rem;
    overflow-y: auto;
    border: 1px solid var(--border);
    background: #fafafa;
    padding: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.9rem;
    white-space: pre-wrap;
    word-break: break-word;
    box-sizing: border-box;
  }
  .debug-transcript .turn-operator { color: var(--accent); }
  .debug-transcript .turn-customer { color: var(--fg); }
  .debug-transcript .turn-error { color: var(--error); }
  .debug-form textarea {
    width: 100%;
    min-height: 3rem;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 0.92rem;
    border: 1px solid var(--border);
    border-radius: 3px;
    box-sizing: border-box;
    resize: vertical;
  }
  .debug-form button {
    margin-top: 8px;
    padding: 6px 12px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    border-radius: 3px;
    cursor: pointer;
  }
  .debug-form button[disabled] {
    background: var(--muted);
    border-color: var(--muted);
    cursor: not-allowed;
  }
  .debug-channel-note {
    font-size: 0.85rem;
    margin: 6px 0 0 0;
  }
  .debug-state dl { margin: 0.4em 0; }
  .debug-state-row {
    display: flex;
    gap: 6px;
    align-items: baseline;
    margin-top: 0.2em;
  }
  .debug-state dt {
    font-weight: 600;
    color: var(--muted);
    margin: 0;
    flex: 0 0 auto;
  }
  .debug-state dd {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.95rem;
    flex: 1 1 auto;
    min-width: 0;
  }
  .debug-state .badge-ok { color: var(--accent); }
  .debug-state .badge-bad { color: var(--error); }
  .debug-lines-scroll {
    max-height: 18rem;
    overflow: auto;
    border: 1px solid var(--border);
    background: var(--panel);
  }
  .debug-lines-scroll table {
    border: none;
    width: 100%;
  }
  .debug-lines-scroll th,
  .debug-lines-scroll td {
    background: var(--panel);
  }
  @media (max-width: 900px) {
    .debug-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<header>
  <a href="/admin/pilot/orders"><strong>Panel piloto de pedidos</strong></a>
  {% block crumb %}{% endblock %}
</header>
<main>
{% block body %}{% endblock %}
</main>
<script>
(function () {
  "use strict";
  var STATE_FIELDS = [
    { key: "context_type", attr: "data-debug-context" },
    { key: "pending_encoding", attr: "data-debug-encoding" },
    { key: "active_intent", attr: "data-debug-active-intent" },
    { key: "active_status", attr: "data-debug-active-status" },
    { key: "candidate_count", attr: "data-debug-candidate-count" },
    { key: "requirements_pending_count", attr: "data-debug-requirements-pending" },
    { key: "requirements_completed_count", attr: "data-debug-requirements-completed" },
    { key: "queue_length", attr: "data-debug-queue-length" },
    { key: "schema_version", attr: "data-debug-schema-version" },
    { key: "consistency", attr: "data-debug-consistency" }
  ];

  function updateExecutionState(state) {
    if (!state || typeof state !== "object") {
      return false;
    }
    var updated = false;
    STATE_FIELDS.forEach(function (field) {
      var node = document.querySelector("[" + field.attr + "]");
      if (!node) {
        return;
      }
      if (!Object.prototype.hasOwnProperty.call(state, field.key)) {
        return;
      }
      var raw = state[field.key];
      var text;
      if (field.key === "schema_version" && (raw === null || raw === undefined || raw === "")) {
        text = "—";
      } else if (raw === null || raw === undefined) {
        text = "—";
      } else {
        text = String(raw);
      }
      node.textContent = text;
      updated = true;
    });
    return updated;
  }

  var forms = document.querySelectorAll("[data-debug-form]");
  forms.forEach(function (form) {
    var transcript = document.querySelector("[data-debug-transcript]");
    var status = document.querySelector("[data-debug-status]");
    var submit = form.querySelector("[data-debug-submit]");
    var textarea = form.querySelector("[data-debug-textarea]");

    function appendLine(kind, text) {
      if (!transcript) {
        return;
      }
      var p = document.createElement("p");
      p.className = "turn-" + kind;
      p.textContent = text;
      transcript.appendChild(p);
      transcript.scrollTop = transcript.scrollHeight;
    }

    function setStatus(text) {
      if (status) {
        status.textContent = text;
      }
    }

    function setBusy(busy) {
      if (submit) {
        submit.disabled = busy;
      }
      if (textarea) {
        textarea.disabled = busy;
      }
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      if (!textarea) {
        return;
      }
      var raw = textarea.value || "";
      var trimmed = raw.trim();
      if (!trimmed) {
        setStatus("Mensaje vacío: no se envió nada.");
        return;
      }
      appendLine("operator", "Operador: " + raw);
      setBusy(true);
      setStatus("Enviando al canal local…");
      fetch(form.action, {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          "X-Local-Test-Origin": "same-origin"
        },
        body: JSON.stringify({ message: trimmed })
      })
        .then(function (response) {
          return response.json().catch(function () {
            return {};
          }).then(function (data) {
            return { ok: response.ok, data: data };
          });
        })
        .then(function (result) {
          if (!result.ok || !result.data || !Array.isArray(result.data.responses) || !result.data.execution_state || typeof result.data.execution_state !== "object") {
            appendLine("error", "Cliente: " + (result.data && result.data.message ? result.data.message : "El canal local rechazó el mensaje."));
            setStatus("Error del canal local. No se realizó ningún cambio.");
            return;
          }
          if (result.data.responses.length === 0) {
            appendLine("customer", "Cliente: (sin respuesta)");
          } else {
            result.data.responses.forEach(function (entry) {
              var text = entry && typeof entry.message === "string" ? entry.message : "";
              appendLine("customer", "Cliente: " + text);
            });
          }
          updateExecutionState(result.data.execution_state);
          setStatus("Turno procesado por el pipeline transaccional. El transcript vive solo en esta pestaña.");
        })
        .catch(function () {
          appendLine("error", "Cliente: El canal local rechazó el mensaje.");
          setStatus("Error del canal local. No se realizó ningún cambio.");
        })
        .then(function () {
          setBusy(false);
          textarea.value = "";
        });
    });
  });
})();
</script>
</body>
</html>
