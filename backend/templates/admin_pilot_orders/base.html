<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Panel piloto de pedidos{% endblock %}</title>
<style>
  :root {
    --bg: #f7f7f8;
    --fg: #1d1f23;
    --muted: #6b7280;
    --accent: #1d4ed8;
    --border: #d8d8de;
    --panel: #ffffff;
    --warn: #b45309;
    --error: #b91c1c;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.45;
  }
  header {
    background: #1d1f23;
    color: #ffffff;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  header a { color: inherit; text-decoration: none; }
  header a.home-link { color: #cbd5e1; font-weight: 600; }
  header a.home-link:hover,
  header a.home-link:focus-visible {
    color: #ffffff;
    text-decoration: underline;
    outline: none;
  }
  header a.home-link:focus-visible {
    box-shadow: 0 0 0 2px #ffd166;
    border-radius: 3px;
    padding: 2px 4px;
  }
  header .crumb { color: #cbd5e1; font-size: 0.85em; }
  main {
    padding: 16px 24px;
    max-width: 1280px;
    margin: 0 auto;
  }
  h1, h2, h3 { margin: 0.4em 0; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 1.4em; }
  h3 { font-size: 1.0rem; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  th, td {
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    font-size: 0.92rem;
  }
  th {
    background: #ececef;
    font-weight: 600;
  }
  dl { margin: 0.6em 0; }
  dt {
    font-weight: 600;
    color: var(--muted);
    margin-top: 0.4em;
  }
  dd { margin: 0 0 0.2em 0; }
  code { font-size: 0.85em; background: #ececef; padding: 1px 4px; border-radius: 3px; }
  .muted { color: var(--muted); }
  .notice {
    border: 1px solid var(--border);
    padding: 10px 14px;
    background: #fff8e6;
    border-radius: 4px;
    margin: 10px 0;
  }
  .empty {
    border: 1px dashed var(--border);
    padding: 14px;
    background: var(--panel);
    color: var(--muted);
    text-align: center;
  }
  .error {
    border: 1px solid var(--error);
    background: #fde8e8;
    padding: 10px 14px;
    border-radius: 4px;
    color: var(--error);
  }
  .warn { color: var(--warn); }
  .filters {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .filters label { display: block; margin: 6px 0; font-size: 0.9rem; }
  .filters input, .filters select {
    padding: 4px 6px;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 3px;
  }
  .filters button {
    padding: 6px 12px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    border-radius: 3px;
    cursor: pointer;
  }
  .pager { margin-top: 12px; display: flex; gap: 12px; align-items: center; }
  .pager .current { font-weight: 600; }
  .pager a {
    color: var(--accent);
    text-decoration: none;
  }
  .panel-section {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 16px;
    margin: 12px 0;
  }
  .outbound {
    border-left: 3px solid var(--accent);
    padding: 6px 10px;
    margin: 6px 0;
    background: #f4f6fb;
  }
  .outbound pre {
    white-space: pre-wrap;
    word-break: break-word;
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 8px;
    margin: 6px 0 0;
  }
  .receipt + .outbound { margin-left: 16px; }
  .debug-grid {
    display: grid;
    gap: 16px;
    grid-template-columns: minmax(16rem, 30%) minmax(16rem, 30%) minmax(20rem, 40%);
    align-items: start;
    margin: 16px 0;
  }
  .debug-column {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 16px;
    min-width: 0;
  }
  .debug-column h2 { margin-top: 0; }
  .debug-transcript {
    height: 12rem;
    overflow-y: auto;
    border: 1px solid var(--border);
    background: #fafafa;
    padding: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.9rem;
    white-space: pre-wrap;
    word-break: break-word;
    box-sizing: border-box;
  }
  .debug-transcript .turn-operator { color: var(--accent); }
  .debug-transcript .turn-customer { color: var(--fg); }
  .debug-transcript .turn-error { color: var(--error); }
  .debug-emulator-conversation {
    height: 12rem;
    overflow-y: auto;
    border: 1px solid var(--border);
    background: #fafafa;
    padding: 8px;
    margin: 6px 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.9rem;
    box-sizing: border-box;
    user-select: text;
    -webkit-user-select: text;
  }
  .debug-emulator-turn {
    display: block;
    margin: 0 0 6px 0;
    padding: 4px 6px;
    border-left: 3px solid var(--border);
    background: var(--panel);
    white-space: pre-wrap;
    word-break: break-word;
    user-select: text;
    -webkit-user-select: text;
  }
  .debug-emulator-turn:last-child { margin-bottom: 0; }
  .debug-emulator-turn-label {
    display: inline-block;
    font-weight: 600;
    margin-right: 6px;
    font-size: 0.85em;
  }
  .debug-emulator-turn-body {
    user-select: text;
    -webkit-user-select: text;
  }
  .debug-emulator-turn-sent {
    border-left-color: var(--accent);
    background: #f4f6fb;
  }
  .debug-emulator-turn-sent .debug-emulator-turn-label { color: var(--accent); }
  .debug-emulator-turn-received {
    border-left-color: var(--fg);
    background: var(--panel);
  }
  .debug-emulator-turn-received .debug-emulator-turn-label { color: var(--fg); }
  .debug-emulator-turn-status {
    border-left-color: var(--muted);
    background: #f1f1f4;
  }
  .debug-emulator-turn-status .debug-emulator-turn-label { color: var(--muted); }
  .debug-emulator-turn-error {
    border-left-color: var(--error);
    background: #fde8e8;
  }
  .debug-emulator-turn-error .debug-emulator-turn-label { color: var(--error); }
  .debug-emulator-turn-timestamp {
    float: right;
    margin-left: 8px;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-size: 0.78em;
    white-space: nowrap;
  }
  .debug-emulator-timeline {
    margin: 6px 0 12px 0;
  }
  .debug-emulator-timeline .debug-state-row {
    align-items: baseline;
  }
  .debug-emulator-timeline dd {
    font-family: ui-monospace, SFMono-Regular, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-size: 0.92em;
  }
  .debug-form textarea {
    width: 100%;
    min-height: 3rem;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 0.92rem;
    border: 1px solid var(--border);
    border-radius: 3px;
    box-sizing: border-box;
    resize: vertical;
  }
  .debug-form button {
    margin-top: 8px;
    padding: 6px 12px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    border-radius: 3px;
    cursor: pointer;
  }
  .debug-form button[disabled] {
    background: var(--muted);
    border-color: var(--muted);
    cursor: not-allowed;
  }
  .debug-channel-note {
    font-size: 0.85rem;
    margin: 6px 0 0 0;
  }
  .debug-state dl { margin: 0.4em 0; }
  .debug-state-row {
    display: flex;
    gap: 6px;
    align-items: baseline;
    margin-top: 0.2em;
  }
  .debug-state dt {
    font-weight: 600;
    color: var(--muted);
    margin: 0;
    flex: 0 0 auto;
  }
  .debug-state dd {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.95rem;
    flex: 1 1 auto;
    min-width: 0;
  }
  .debug-state .badge-ok { color: var(--accent); }
  .debug-state .badge-bad { color: var(--error); }
  .debug-style { margin: 0.4em 0; }
  .debug-style p.muted { margin: 0; }
  .debug-lines-scroll {
    max-height: 18rem;
    overflow: auto;
    border: 1px solid var(--border);
    background: var(--panel);
  }
  .debug-lines-scroll table {
    border: none;
    width: 100%;
  }
  .debug-lines-scroll th,
  .debug-lines-scroll td {
    background: var(--panel);
  }
  @media (max-width: 900px) {
    .debug-grid {
      grid-template-columns: 1fr;
    }
  }
  .bootstrap-section {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 16px;
    margin: 12px 0;
  }
  .bootstrap-form input[type="number"] {
    padding: 4px 6px;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 3px;
    margin: 4px 0 8px 0;
    display: block;
  }
  .bootstrap-form textarea {
    width: 100%;
    min-height: 3rem;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 0.92rem;
    border: 1px solid var(--border);
    border-radius: 3px;
    box-sizing: border-box;
    resize: vertical;
    margin: 4px 0 8px 0;
  }
  .bootstrap-form button {
    padding: 6px 12px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    border-radius: 3px;
    cursor: pointer;
  }
  .bootstrap-form button[disabled] {
    background: var(--muted);
    border-color: var(--muted);
    cursor: not-allowed;
  }
  .bootstrap-form input[disabled],
  .bootstrap-form textarea[disabled] {
    background: #f1f1f4;
    color: var(--muted);
  }
  .bootstrap-result {
    margin: 6px 0;
  }
  .bootstrap-note {
    font-size: 0.85rem;
    margin: 6px 0 0 0;
  }
</style>
</head>
<body>
<header>
  <a href="/admin/pilot/orders"><strong>Panel piloto de pedidos</strong></a>
  <a class="home-link" href="/admin" aria-label="Inicio del panel administrativo">Inicio</a>
  {% block crumb %}{% endblock %}
</header>
<main>
{% block body %}{% endblock %}
</main>
<script>
(function () {
  "use strict";
  var STATE_FIELDS = [
    { key: "context_type", attr: "data-debug-context" },
    { key: "pending_encoding", attr: "data-debug-encoding" },
    { key: "active_intent", attr: "data-debug-active-intent" },
    { key: "active_status", attr: "data-debug-active-status" },
    { key: "candidate_count", attr: "data-debug-candidate-count" },
    { key: "requirements_pending_count", attr: "data-debug-requirements-pending" },
    { key: "requirements_completed_count", attr: "data-debug-requirements-completed" },
    { key: "queue_length", attr: "data-debug-queue-length" },
    { key: "schema_version", attr: "data-debug-schema-version" },
    { key: "consistency", attr: "data-debug-consistency" }
  ];

  function updateExecutionState(state) {
    if (!state || typeof state !== "object") {
      return false;
    }
    var updated = false;
    STATE_FIELDS.forEach(function (field) {
      var node = document.querySelector("[" + field.attr + "]");
      if (!node) {
        return;
      }
      if (!Object.prototype.hasOwnProperty.call(state, field.key)) {
        return;
      }
      var raw = state[field.key];
      var text;
      if (field.key === "schema_version" && (raw === null || raw === undefined || raw === "")) {
        text = "—";
      } else if (raw === null || raw === undefined) {
        text = "—";
      } else {
        text = String(raw);
      }
      node.textContent = text;
      updated = true;
    });
    return updated;
  }

  var EMPTY_DASH_TEXT = "—";

  var STYLE_FIELDS = [
    { key: "outcome", label: "Outcome" },
    { key: "eligible_count", label: "Elegibles" },
    { key: "applied_count", label: "Aplicados" },
    { key: "fallback_category", label: "Categoría fallback" },
    { key: "flavor_code", label: "Flavor" },
    { key: "response_types", label: "Tipos" },
    { key: "template_version", label: "Plantilla" }
  ];

  var ALLOWED_STYLE_OUTCOMES = {
    applied: true,
    fallback: true,
    not_attempted: true
  };

  function isStringValue(value) {
    return typeof value === "string" && value.length > 0;
  }

  function isBoundedIntegerValue(value) {
    return Number.isInteger(value) && value >= 0 && value <= 200;
  }

  function isResponseTypeArray(value) {
    if (!Array.isArray(value)) {
      return false;
    }
    for (var i = 0; i < value.length; i++) {
      if (!isStringValue(value[i])) {
        return false;
      }
    }
    return true;
  }

  function isValidOutboundStyle(diag) {
    if (!diag || typeof diag !== "object") {
      return false;
    }
    if (!ALLOWED_STYLE_OUTCOMES[diag.outcome]) {
      return false;
    }
    if (!isBoundedIntegerValue(diag.eligible_count)) {
      return false;
    }
    if (!isBoundedIntegerValue(diag.applied_count)) {
      return false;
    }
    if (
      diag.fallback_category !== null &&
      !isStringValue(diag.fallback_category)
    ) {
      return false;
    }
    if (diag.flavor_code !== null && !isStringValue(diag.flavor_code)) {
      return false;
    }
    if (!isResponseTypeArray(diag.response_types)) {
      return false;
    }
    if (!isStringValue(diag.template_version)) {
      return false;
    }
    return true;
  }

  function formatStyleValue(value) {
    if (Array.isArray(value)) {
      return value.join(", ");
    }
    return String(value);
  }

  function updateOutboundStyle(diag) {
    var container = document.querySelector("[data-debug-outbound-style]");
    if (!container) {
      return false;
    }
    if (!isValidOutboundStyle(diag)) {
      return false;
    }
    var rows = [];
    for (var i = 0; i < STYLE_FIELDS.length; i++) {
      var field = STYLE_FIELDS[i];
      var value = diag[field.key];
      if (value === null || value === undefined) {
        continue;
      }
      if (Array.isArray(value) && value.length === 0) {
        continue;
      }
      var row = document.createElement("div");
      row.className = "debug-state-row";
      var dt = document.createElement("dt");
      dt.textContent = field.label + ":";
      var dd = document.createElement("dd");
      dd.textContent = formatStyleValue(value);
      row.appendChild(dt);
      row.appendChild(dd);
      rows.push(row);
    }
    var emptyNode = container.querySelector(
      "[data-debug-outbound-style-empty]"
    );
    container.replaceChildren.apply(container, rows);
    if (emptyNode) {
      emptyNode.remove();
    }
    return true;
  }

  function isValidLineEntry(entry) {
    if (!entry || typeof entry !== "object") {
      return false;
    }
    if (!Number.isInteger(entry.id) || entry.id <= 0) {
      return false;
    }
    if (typeof entry.producto_nombre !== "string") {
      return false;
    }
    if (
      entry.presentacion_descripcion !== null &&
      typeof entry.presentacion_descripcion !== "string"
    ) {
      return false;
    }
    if (!Number.isInteger(entry.cantidad) || entry.cantidad <= 0) {
      return false;
    }
    if (typeof entry.precio_unitario_display !== "string") {
      return false;
    }
    if (
      entry.observaciones !== null &&
      typeof entry.observaciones !== "string"
    ) {
      return false;
    }
    return true;
  }

  function validateOrderLines(lines) {
    if (!Array.isArray(lines)) {
      return false;
    }
    for (var i = 0; i < lines.length; i++) {
      if (!isValidLineEntry(lines[i])) {
        return false;
      }
    }
    return true;
  }

  function buildLineCell(text) {
    var td = document.createElement("td");
    if (text === null || text === undefined || text === "") {
      var span = document.createElement("span");
      span.className = "muted";
      span.textContent = EMPTY_DASH_TEXT;
      td.appendChild(span);
    } else {
      td.textContent = String(text);
    }
    return td;
  }

  function buildLineRow(entry) {
    var tr = document.createElement("tr");

    var lineCell = document.createElement("td");
    lineCell.textContent = "#" + String(entry.id);
    tr.appendChild(lineCell);

    tr.appendChild(buildLineCell(entry.producto_nombre));

    var presentacionCell = document.createElement("td");
    if (entry.presentacion_descripcion !== null && entry.presentacion_descripcion !== "") {
      presentacionCell.textContent = entry.presentacion_descripcion;
    } else {
      var dashSpan = document.createElement("span");
      dashSpan.className = "muted";
      dashSpan.textContent = EMPTY_DASH_TEXT;
      presentacionCell.appendChild(dashSpan);
    }
    tr.appendChild(presentacionCell);

    tr.appendChild(buildLineCell(entry.cantidad));

    tr.appendChild(buildLineCell(entry.precio_unitario_display));

    var obsCell = document.createElement("td");
    if (entry.observaciones !== null && entry.observaciones !== "") {
      obsCell.textContent = entry.observaciones;
    } else {
      var obsSpan = document.createElement("span");
      obsSpan.className = "muted";
      obsSpan.textContent = EMPTY_DASH_TEXT;
      obsCell.appendChild(obsSpan);
    }
    tr.appendChild(obsCell);

    return tr;
  }

  function updateOrderLines(lines) {
    if (!validateOrderLines(lines)) {
      return false;
    }
    var tbody = document.querySelector("[data-debug-lines-tbody]");
    var empty = document.querySelector("[data-debug-lines-empty]");
    if (!tbody || !empty) {
      return false;
    }
    var fragment = document.createDocumentFragment();
    for (var i = 0; i < lines.length; i++) {
      fragment.appendChild(buildLineRow(lines[i]));
    }
    tbody.replaceChildren(fragment);
    if (lines.length === 0) {
      empty.hidden = false;
    } else {
      empty.hidden = true;
    }
    return true;
  }

  var forms = document.querySelectorAll("[data-debug-form]");
  forms.forEach(function (form) {
    var transcript = document.querySelector("[data-debug-transcript]");
    var status = document.querySelector("[data-debug-status]");
    var submit = form.querySelector("[data-debug-submit]");
    var textarea = form.querySelector("[data-debug-textarea]");

    function appendLine(kind, text) {
      if (!transcript) {
        return;
      }
      var p = document.createElement("p");
      p.className = "turn-" + kind;
      p.textContent = text;
      transcript.appendChild(p);
      transcript.scrollTop = transcript.scrollHeight;
    }

    function setStatus(text) {
      if (status) {
        status.textContent = text;
      }
    }

    function setBusy(busy) {
      if (submit) {
        submit.disabled = busy;
      }
      if (textarea) {
        textarea.disabled = busy;
      }
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      if (!textarea) {
        return;
      }
      var raw = textarea.value || "";
      var trimmed = raw.trim();
      if (!trimmed) {
        setStatus("Mensaje vacío: no se envió nada.");
        return;
      }
      appendLine("operator", "Operador: " + raw);
      setBusy(true);
      setStatus("Enviando al canal local…");
      fetch(form.action, {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          "X-Local-Test-Origin": "same-origin"
        },
        body: JSON.stringify({ message: trimmed })
      })
        .then(function (response) {
          return response.json().catch(function () {
            return {};
          }).then(function (data) {
            return { ok: response.ok, data: data };
          });
        })
        .then(function (result) {
          if (
            !result.ok ||
            !result.data ||
            !Array.isArray(result.data.responses) ||
            !result.data.execution_state ||
            typeof result.data.execution_state !== "object" ||
            !Array.isArray(result.data.order_lines) ||
            !validateOrderLines(result.data.order_lines)
          ) {
            appendLine("error", "Cliente: " + (result.data && result.data.message ? result.data.message : "El canal local rechazó el mensaje."));
            setStatus("Error del canal local. No se realizó ningún cambio.");
            return;
          }
          if (result.data.responses.length === 0) {
            appendLine("customer", "Cliente: (sin respuesta)");
          } else {
            result.data.responses.forEach(function (entry) {
              var text = entry && typeof entry.message === "string" ? entry.message : "";
              appendLine("customer", "Cliente: " + text);
            });
          }
          updateExecutionState(result.data.execution_state);
          updateOrderLines(result.data.order_lines);
          updateOutboundStyle(result.data.outbound_style);
          setStatus("Turno procesado por el pipeline transaccional. El transcript vive solo en esta pestaña.");
        })
        .catch(function () {
          appendLine("error", "Cliente: El canal local rechazó el mensaje.");
          setStatus("Error del canal local. No se realizó ningún cambio.");
        })
        .then(function () {
          setBusy(false);
          textarea.value = "";
        });
    });
  });

  var ALLOWED_EMULATOR_STATUSES = {
    accepted: true,
    processed: true,
    pending: true,
    sent: true,
    retryable: true,
    terminal: true
  };

  var TERMINAL_EMULATOR_STATUSES = {
    sent: true,
    retryable: true,
    terminal: true
  };

  var EMULATOR_MAX_POLL_ATTEMPTS = 20;
  var EMULATOR_POLL_INTERVAL_MS = 1500;

  function isValidEmulatorSubmitResponse(data) {
    return (
      data &&
      typeof data === "object" &&
      typeof data.synthetic_inbound_id === "string" &&
      data.synthetic_inbound_id.length > 0
    );
  }

  function isValidEmulatorStatusResponse(data) {
    return (
      data &&
      typeof data === "object" &&
      typeof data.status === "string" &&
      ALLOWED_EMULATOR_STATUSES[data.status] === true
    );
  }

  function isBoundedDisplayString(value) {
    return typeof value === "string" && value.length > 0 && value.length <= 4096;
  }

  var EMULATOR_CONVERSATION_MAX_TURNS = 100;
  var EMULATOR_CONVERSATION_TEXT_LIMIT = 4096;

  var EMULATOR_CONVERSATION_KIND_KEYS = [
    "sent",
    "status",
    "received",
    "error"
  ];

  var EMULATOR_CONVERSATION_KIND_SET = {
    sent: true,
    status: true,
    received: true,
    error: true
  };

  function truncateEmulatorConversationText(value) {
    if (typeof value !== "string") {
      return "";
    }
    if (value.length <= EMULATOR_CONVERSATION_TEXT_LIMIT) {
      return value;
    }
    return value.slice(0, EMULATOR_CONVERSATION_TEXT_LIMIT);
  }

  function createEmulatorConversationState(container) {
    return {
      container: container || null,
      turnMap: {},
      turnOrder: []
    };
  }

  function createEmulatorTurnElement(kind, label, body, observedAtIso) {
    var item = document.createElement("div");
    item.setAttribute("role", "listitem");
    item.className =
      "debug-emulator-turn debug-emulator-turn-" + kind;
    var labelSpan = document.createElement("span");
    labelSpan.className = "debug-emulator-turn-label";
    labelSpan.textContent = label;
    var bodySpan = document.createElement("span");
    bodySpan.className = "debug-emulator-turn-body";
    bodySpan.textContent = body;
    item.appendChild(labelSpan);
    item.appendChild(bodySpan);
    if (observedAtIso) {
      var timestampSpan = document.createElement("span");
      timestampSpan.className = "debug-emulator-turn-timestamp";
      timestampSpan.setAttribute("data-debug-emulator-turn-timestamp", kind);
      timestampSpan.textContent = formatLocalTimeFromIso(observedAtIso);
      item.appendChild(timestampSpan);
    }
    return item;
  }

  function createEmulatorTurnEntry() {
    var entry = {};
    for (var i = 0; i < EMULATOR_CONVERSATION_KIND_KEYS.length; i++) {
      entry[EMULATOR_CONVERSATION_KIND_KEYS[i]] = null;
    }
    entry.observedAtIsoByKind = {};
    for (var j = 0; j < EMULATOR_CONVERSATION_KIND_KEYS.length; j++) {
      entry.observedAtIsoByKind[EMULATOR_CONVERSATION_KIND_KEYS[j]] = null;
    }
    return entry;
  }

  function getEmulatorTurnObservedAtIso(entry, kind) {
    if (!entry || !entry.observedAtIsoByKind || !kind) {
      return null;
    }
    return entry.observedAtIsoByKind[kind] || null;
  }

  function setEmulatorTurnObservedAtIso(entry, kind, observedAtIso) {
    if (!entry || !entry.observedAtIsoByKind || !kind) {
      return;
    }
    entry.observedAtIsoByKind[kind] = observedAtIso || null;
  }

  function getEmulatorTurnEntryKindElement(entry, kind) {
    if (!entry || !kind) {
      return null;
    }
    return entry[kind] || null;
  }

  function setEmulatorTurnEntryKindElement(entry, kind, element) {
    if (!entry || !kind) {
      return;
    }
    entry[kind] = element || null;
  }

  function captureObservedAtIso() {
    try {
      return new Date().toISOString();
    } catch (err) {
      return null;
    }
  }

  function formatLocalTimeFromIso(iso) {
    if (typeof iso !== "string" || !iso) {
      return "";
    }
    var parsed = new Date(iso);
    if (isNaN(parsed.getTime())) {
      return "";
    }
    return formatLocalTime(parsed);
  }

  function formatLocalTime(date) {
    if (!(date instanceof Date) || isNaN(date.getTime())) {
      return "";
    }
    var h = String(date.getHours());
    if (h.length < 2) {
      h = "0" + h;
    }
    var m = String(date.getMinutes());
    if (m.length < 2) {
      m = "0" + m;
    }
    var s = String(date.getSeconds());
    if (s.length < 2) {
      s = "0" + s;
    }
    var ms = String(date.getMilliseconds());
    while (ms.length < 3) {
      ms = "0" + ms;
    }
    return h + ":" + m + ":" + s + "." + ms;
  }

  function trimEmulatorConversation(state) {
    if (!state || !state.container || !state.turnOrder) {
      return;
    }
    while (state.turnOrder.length > EMULATOR_CONVERSATION_MAX_TURNS) {
      var oldestKey = state.turnOrder.shift();
      var entry = state.turnMap[oldestKey];
      if (entry) {
        for (var i = 0; i < EMULATOR_CONVERSATION_KIND_KEYS.length; i++) {
          var kind = EMULATOR_CONVERSATION_KIND_KEYS[i];
          var element = getEmulatorTurnEntryKindElement(entry, kind);
          if (
            element &&
            element.parentNode &&
            element.parentNode === state.container
          ) {
            state.container.removeChild(element);
          }
          setEmulatorTurnEntryKindElement(entry, kind, null);
        }
        delete state.turnMap[oldestKey];
      }
    }
  }

  function scrollEmulatorConversationToBottom(state) {
    if (!state || !state.container) {
      return;
    }
    state.container.scrollTop = state.container.scrollHeight;
  }

  function appendOrUpdateEmulatorTurn(state, key, kind, label, body) {
    if (!state || !state.container || !key) {
      return null;
    }
    if (!EMULATOR_CONVERSATION_KIND_SET[kind]) {
      return null;
    }
    var safeLabel = truncateEmulatorConversationText(label);
    var safeBody = truncateEmulatorConversationText(body);
    var entry = state.turnMap[key];
    if (!entry) {
      if (kind !== "sent") {
        return null;
      }
      entry = createEmulatorTurnEntry();
      state.turnMap[key] = entry;
      state.turnOrder.push(key);
    }
    var observedAtIso = captureObservedAtIso();
    if (observedAtIso) {
      setEmulatorTurnObservedAtIso(entry, kind, observedAtIso);
    }
    var observedAtIsoForKind = getEmulatorTurnObservedAtIso(entry, kind);
    var existingElement = getEmulatorTurnEntryKindElement(entry, kind);
    if (existingElement) {
      existingElement.className =
        "debug-emulator-turn debug-emulator-turn-" + kind;
      if (existingElement.firstChild) {
        existingElement.firstChild.textContent = safeLabel;
      }
      var bodyNode = existingElement.querySelector(
        ".debug-emulator-turn-body"
      );
      if (bodyNode) {
        bodyNode.textContent = safeBody;
      } else {
        var bodySpan = document.createElement("span");
        bodySpan.className = "debug-emulator-turn-body";
        bodySpan.textContent = safeBody;
        existingElement.appendChild(bodySpan);
      }
      var timestampNode = existingElement.querySelector(
        "[data-debug-emulator-turn-timestamp]"
      );
      if (!timestampNode) {
        if (observedAtIsoForKind) {
          var tsSpan = document.createElement("span");
          tsSpan.className = "debug-emulator-turn-timestamp";
          tsSpan.setAttribute("data-debug-emulator-turn-timestamp", kind);
          tsSpan.textContent = formatLocalTimeFromIso(observedAtIsoForKind);
          existingElement.appendChild(tsSpan);
        }
      } else {
        timestampNode.textContent = formatLocalTimeFromIso(
          observedAtIsoForKind
        );
      }
      scrollEmulatorConversationToBottom(state);
      return entry;
    }
    var element = createEmulatorTurnElement(
      kind,
      safeLabel,
      safeBody,
      observedAtIsoForKind
    );
    state.container.appendChild(element);
    setEmulatorTurnEntryKindElement(entry, kind, element);
    trimEmulatorConversation(state);
    scrollEmulatorConversationToBottom(state);
    return entry;
  }

  function rekeyEmulatorTurn(state, oldKey, newKey) {
    if (!state || oldKey === newKey || !oldKey || !newKey) {
      return;
    }
    var entry = state.turnMap[oldKey];
    if (!entry) {
      return;
    }
    delete state.turnMap[oldKey];
    state.turnMap[newKey] = entry;
    for (var i = 0; i < state.turnOrder.length; i++) {
      if (state.turnOrder[i] === oldKey) {
        state.turnOrder[i] = newKey;
        return;
      }
    }
  }

  function renderEmulatorResult(result) {
    var container = document.querySelector("[data-debug-emulator-result]");
    if (!container) {
      return;
    }
    container.replaceChildren();
    if (!result || typeof result !== "object") {
      return;
    }
    if (isBoundedDisplayString(result.status)) {
      var statusP = document.createElement("p");
      statusP.textContent = "Estado: " + result.status;
      container.appendChild(statusP);
    }
    if (isBoundedDisplayString(result.outbound_body)) {
      var bodyP = document.createElement("p");
      bodyP.textContent = "Mensaje enviado: " + result.outbound_body;
      container.appendChild(bodyP);
    }
    if (isBoundedDisplayString(result.provider_message_sid)) {
      var sidP = document.createElement("p");
      sidP.textContent = "SID: " + result.provider_message_sid;
      container.appendChild(sidP);
    }
  }

  var EMULATOR_TIMELINE_FIELDS = [
    { key: "inbound_received_at", attr: "data-debug-timeline-inbound-received" },
    { key: "llm_requested_at", attr: "data-debug-timeline-llm-requested" },
    { key: "llm_finished_at", attr: "data-debug-timeline-llm-finished" },
    { key: "llm_outcome", attr: "data-debug-timeline-llm-outcome" },
    { key: "processing_finished_at", attr: "data-debug-timeline-processing-finished" },
    { key: "response_staged_at", attr: "data-debug-timeline-response-staged" }
  ];

  var EMULATOR_TIMELINE_OUTCOME_VALUES = {
    completed: true,
    timeout: true,
    error: true
  };

  function renderEmulatorTimelineField(attr, rawValue, kind) {
    var node = document.querySelector("[" + attr + "]");
    if (!node) {
      return false;
    }
    if (rawValue === null || rawValue === undefined || rawValue === "") {
      node.textContent = EMPTY_DASH_TEXT;
      return true;
    }
    if (kind === "outcome") {
      if (typeof rawValue !== "string") {
        return false;
      }
      if (!EMULATOR_TIMELINE_OUTCOME_VALUES[rawValue]) {
        return false;
      }
      node.textContent = rawValue;
      return true;
    }
    if (typeof rawValue !== "string") {
      return false;
    }
    var formatted = formatLocalTimeFromIso(rawValue);
    if (!formatted) {
      return false;
    }
    node.textContent = formatted + " (" + rawValue + " UTC)";
    return true;
  }

  function renderEmulatorTimeline(timeline) {
    var container = document.querySelector("[data-debug-emulator-timeline]");
    if (!container) {
      return false;
    }
    if (!timeline || typeof timeline !== "object") {
      for (var i = 0; i < EMULATOR_TIMELINE_FIELDS.length; i++) {
        renderEmulatorTimelineField(
          EMULATOR_TIMELINE_FIELDS[i].attr,
          null,
          null
        );
      }
      return true;
    }
    for (var j = 0; j < EMULATOR_TIMELINE_FIELDS.length; j++) {
      var field = EMULATOR_TIMELINE_FIELDS[j];
      var value = Object.prototype.hasOwnProperty.call(timeline, field.key)
        ? timeline[field.key]
        : null;
      var kind = field.key === "llm_outcome" ? "outcome" : "timestamp";
      renderEmulatorTimelineField(field.attr, value, kind);
    }
    return true;
  }

  function clearEmulatorResult() {
    var container = document.querySelector("[data-debug-emulator-result]");
    if (container) {
      container.replaceChildren();
    }
  }

  var emulatorForms = document.querySelectorAll("[data-debug-emulator-form]");
  emulatorForms.forEach(function (form) {
    var statusNode = document.querySelector("[data-debug-emulator-status]");
    var submit = form.querySelector("[data-debug-emulator-submit]");
    var textarea = form.querySelector("[data-debug-emulator-textarea]");
    var statusUrl = form.getAttribute("data-debug-emulator-status-url") || "";
    var conversationContainer = document.querySelector(
      "[data-debug-emulator-conversation]"
    );
    var conversationState = createEmulatorConversationState(
      conversationContainer
    );

    var EMULATOR_CONVERSATION_LABELS = {
      sent: "Enviado",
      received: "Respuesta recibida",
      status: "Estado",
      error: "Error"
    };

    function conversationAppendSent(pendingKey, text) {
      appendOrUpdateEmulatorTurn(
        conversationState,
        pendingKey,
        "sent",
        EMULATOR_CONVERSATION_LABELS.sent,
        text
      );
    }

    function conversationMarkError(key, message) {
      appendOrUpdateEmulatorTurn(
        conversationState,
        key,
        "error",
        EMULATOR_CONVERSATION_LABELS.error,
        message
      );
    }

    function conversationAppendStatus(key, statusText) {
      appendOrUpdateEmulatorTurn(
        conversationState,
        key,
        "status",
        EMULATOR_CONVERSATION_LABELS.status,
        statusText
      );
    }

    function conversationAppendReceived(key, bodyText) {
      appendOrUpdateEmulatorTurn(
        conversationState,
        key,
        "received",
        EMULATOR_CONVERSATION_LABELS.received,
        bodyText
      );
    }

    function setStatus(text) {
      if (statusNode) {
        statusNode.textContent = text;
      }
    }

    function setBusy(busy) {
      if (submit) {
        submit.disabled = busy;
      }
      if (textarea) {
        textarea.disabled = busy;
      }
    }

    function failGeneric(errorKey) {
      clearEmulatorResult();
      if (errorKey) {
        conversationMarkError(errorKey, "El Twilio Emulator rechazó el mensaje.");
      }
      renderEmulatorTimeline(null);
      setStatus("El Twilio Emulator rechazó el mensaje.");
      setBusy(false);
    }

    var pendingPollHandle = null;
    var currentInboundId = null;
    var submissionCounter = 0;

    function pollEmulatorStatus(attemptsLeft) {
      if (attemptsLeft <= 0 || !currentInboundId || !statusUrl) {
        failGeneric(currentInboundId);
        return;
      }
      pendingPollHandle = setTimeout(function () {
        pendingPollHandle = null;
        fetch(statusUrl, {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
            "X-Emulator-Test-Origin": "same-origin"
          },
          body: JSON.stringify({ synthetic_inbound_id: currentInboundId })
        })
          .then(function (response) {
            return response.json().catch(function () {
              return {};
            }).then(function (data) {
              return { ok: response.ok, data: data };
            });
          })
          .then(function (result) {
            if (!result.ok || !isValidEmulatorStatusResponse(result.data)) {
              failGeneric(currentInboundId);
              return;
            }
            renderEmulatorResult(result.data);
            renderEmulatorTimeline(result.data.timeline);
            if (result.data.status === "processed" && isBoundedDisplayString(result.data.outbound_body)) {
              conversationAppendReceived(currentInboundId, result.data.outbound_body);
            } else if (
              result.data.status === "sent" &&
              isBoundedDisplayString(result.data.outbound_body)
            ) {
              conversationAppendReceived(currentInboundId, result.data.outbound_body);
            } else if (result.data.status === "retryable" || result.data.status === "terminal") {
              conversationMarkError(currentInboundId, "Estado: " + result.data.status);
            } else if (
              result.data.status === "accepted" ||
              result.data.status === "pending"
            ) {
              conversationAppendStatus(currentInboundId, result.data.status);
            } else {
              conversationAppendStatus(currentInboundId, result.data.status);
            }
            if (TERMINAL_EMULATOR_STATUSES[result.data.status] === true) {
              setStatus("Listo.");
              setBusy(false);
              currentInboundId = null;
              return;
            }
            setStatus("Esperando estado final…");
            pollEmulatorStatus(attemptsLeft - 1);
          })
          .catch(function () {
            failGeneric(currentInboundId);
          });
      }, EMULATOR_POLL_INTERVAL_MS);
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      if (!textarea || !statusUrl) {
        return;
      }
      if (pendingPollHandle !== null) {
        clearTimeout(pendingPollHandle);
        pendingPollHandle = null;
      }
      currentInboundId = null;
      var raw = textarea.value || "";
      var trimmed = raw.trim();
      if (!trimmed) {
        setStatus("Mensaje vacío: no se envió nada.");
        return;
      }
      clearEmulatorResult();
      setBusy(true);
      setStatus("Enviando al Twilio Emulator…");
      submissionCounter += 1;
      var pendingKey = "pending-" + String(submissionCounter);
      conversationAppendSent(pendingKey, trimmed);
      fetch(form.action, {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          "X-Emulator-Test-Origin": "same-origin"
        },
        body: JSON.stringify({ message: trimmed })
      })
        .then(function (response) {
          return response.json().catch(function () {
            return {};
          }).then(function (data) {
            return { ok: response.ok, data: data };
          });
        })
        .then(function (result) {
          if (!result.ok || !isValidEmulatorSubmitResponse(result.data)) {
            failGeneric(pendingKey);
            return;
          }
          currentInboundId = result.data.synthetic_inbound_id;
          rekeyEmulatorTurn(conversationState, pendingKey, currentInboundId);
          conversationAppendStatus(currentInboundId, result.data.status || "accepted");
          renderEmulatorTimeline(null);
          pollEmulatorStatus(EMULATOR_MAX_POLL_ATTEMPTS);
        })
        .catch(function () {
          failGeneric(pendingKey);
        });
    });
  });

  var BOOTSTRAP_GENERIC_REJECTION_MESSAGE = "El Twilio Emulator rechazó el mensaje.";

  var bootstrapForms = document.querySelectorAll("[data-debug-bootstrap-form]");
  bootstrapForms.forEach(function (form) {
    var statusNode = document.querySelector("[data-debug-bootstrap-status]");
    var resultNode = document.querySelector("[data-debug-bootstrap-result]");
    var submit = form.querySelector("[data-debug-bootstrap-submit]");
    var clienteInput = form.querySelector("[data-debug-bootstrap-cliente]");
    var comercioInput = form.querySelector("[data-debug-bootstrap-comercio]");
    var textarea = form.querySelector("[data-debug-bootstrap-textarea]");

    function setStatus(text) {
      if (statusNode) {
        statusNode.textContent = text;
      }
    }

    function clearResult() {
      if (resultNode) {
        resultNode.textContent = "";
      }
    }

    function setBusy(busy) {
      if (submit) {
        submit.disabled = busy;
      }
      if (textarea) {
        textarea.disabled = busy;
      }
      if (clienteInput) {
        clienteInput.disabled = busy;
      }
      if (comercioInput) {
        comercioInput.disabled = busy;
      }
    }

    function isPositiveInt(value) {
      return typeof value === "string" && /^[1-9][0-9]*$/.test(value);
    }

    function isValidBootstrapResponse(data) {
      return (
        data &&
        typeof data === "object" &&
        typeof data.synthetic_inbound_id === "string" &&
        data.synthetic_inbound_id.length > 0
      );
    }

    function failGeneric() {
      clearResult();
      setStatus(BOOTSTRAP_GENERIC_REJECTION_MESSAGE);
      setBusy(false);
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      if (!textarea || !clienteInput || !comercioInput) {
        return;
      }
      var clienteId = clienteInput.value || "";
      var comercioId = comercioInput.value || "";
      var raw = textarea.value || "";
      var trimmed = raw.trim();
      if (!isPositiveInt(clienteId) || !isPositiveInt(comercioId)) {
        setStatus("IDs inválidos: cliente_id y comercio_id deben ser enteros positivos.");
        return;
      }
      if (!trimmed) {
        setStatus("Mensaje vacío: no se envió nada.");
        return;
      }
      clearResult();
      setBusy(true);
      setStatus("Enviando al Twilio Emulator…");
      fetch(form.action, {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          "X-Emulator-Test-Origin": "same-origin"
        },
        body: JSON.stringify({
          cliente_id: parseInt(clienteId, 10),
          comercio_id: parseInt(comercioId, 10),
          message: trimmed
        })
      })
        .then(function (response) {
          return response.json().catch(function () {
            return {};
          }).then(function (data) {
            return { ok: response.ok, data: data };
          });
        })
        .then(function (result) {
          if (!result.ok || !isValidBootstrapResponse(result.data)) {
            failGeneric();
            return;
          }
          if (resultNode) {
            var syntheticId =
              typeof result.data.synthetic_inbound_id === "string"
                ? result.data.synthetic_inbound_id
                : "";
            if (syntheticId.length > 128) {
              syntheticId = syntheticId.slice(0, 128);
            }
            resultNode.textContent =
              "Aceptado. El pedido aparecerá cuando el worker procese el inbound. Recargá el listado para verlo. ID sintético: " +
              syntheticId;
          }
          setStatus("Ingreso aceptado, procesamiento en curso.");
          textarea.value = "";
        })
        .catch(function () {
          failGeneric();
        })
        .then(function () {
          setBusy(false);
        });
    });
  });

  if (typeof window !== "undefined") {
    window.__panelDebugLines = {
      isValidLineEntry: isValidLineEntry,
      validateOrderLines: validateOrderLines,
      updateOrderLines: updateOrderLines
    };
    window.__panelDebugEmulator = {
      EMULATOR_CONVERSATION_MAX_TURNS: EMULATOR_CONVERSATION_MAX_TURNS,
      EMULATOR_CONVERSATION_TEXT_LIMIT: EMULATOR_CONVERSATION_TEXT_LIMIT,
      EMULATOR_TIMELINE_FIELDS: EMULATOR_TIMELINE_FIELDS,
      EMULATOR_TIMELINE_OUTCOME_VALUES: EMULATOR_TIMELINE_OUTCOME_VALUES,
      truncateEmulatorConversationText: truncateEmulatorConversationText,
      createEmulatorConversationState: createEmulatorConversationState,
      createEmulatorTurnElement: createEmulatorTurnElement,
      appendOrUpdateEmulatorTurn: appendOrUpdateEmulatorTurn,
      rekeyEmulatorTurn: rekeyEmulatorTurn,
      trimEmulatorConversation: trimEmulatorConversation,
      formatLocalTime: formatLocalTime,
      formatLocalTimeFromIso: formatLocalTimeFromIso,
      renderEmulatorTimeline: renderEmulatorTimeline
    };
  }
})();
</script>
</body>
</html>
