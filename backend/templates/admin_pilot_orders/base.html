<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Panel piloto de pedidos{% endblock %}</title>
<style>
  :root {
    --bg: #f7f7f8;
    --fg: #1d1f23;
    --muted: #6b7280;
    --accent: #1d4ed8;
    --border: #d8d8de;
    --panel: #ffffff;
    --warn: #b45309;
    --error: #b91c1c;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.45;
  }
  header {
    background: #1d1f23;
    color: #ffffff;
    padding: 12px 24px;
  }
  header a { color: inherit; text-decoration: none; }
  header .crumb { color: #cbd5e1; font-size: 0.85em; }
  main {
    padding: 16px 24px;
    max-width: 1100px;
    margin: 0 auto;
  }
  h1, h2, h3 { margin: 0.4em 0; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 1.4em; }
  h3 { font-size: 1.0rem; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  th, td {
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    font-size: 0.92rem;
  }
  th {
    background: #ececef;
    font-weight: 600;
  }
  dl { margin: 0.6em 0; }
  dt {
    font-weight: 600;
    color: var(--muted);
    margin-top: 0.4em;
  }
  dd { margin: 0 0 0.2em 0; }
  code { font-size: 0.85em; background: #ececef; padding: 1px 4px; border-radius: 3px; }
  .muted { color: var(--muted); }
  .notice {
    border: 1px solid var(--border);
    padding: 10px 14px;
    background: #fff8e6;
    border-radius: 4px;
    margin: 10px 0;
  }
  .empty {
    border: 1px dashed var(--border);
    padding: 14px;
    background: var(--panel);
    color: var(--muted);
    text-align: center;
  }
  .error {
    border: 1px solid var(--error);
    background: #fde8e8;
    padding: 10px 14px;
    border-radius: 4px;
    color: var(--error);
  }
  .warn { color: var(--warn); }
  .filters {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .filters label { display: block; margin: 6px 0; font-size: 0.9rem; }
  .filters input, .filters select {
    padding: 4px 6px;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 3px;
  }
  .filters button {
    padding: 6px 12px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    border-radius: 3px;
    cursor: pointer;
  }
  .pager { margin-top: 12px; display: flex; gap: 12px; align-items: center; }
  .pager .current { font-weight: 600; }
  .pager a {
    color: var(--accent);
    text-decoration: none;
  }
  .panel-section {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 16px;
    margin: 12px 0;
  }
  .outbound {
    border-left: 3px solid var(--accent);
    padding: 6px 10px;
    margin: 6px 0;
    background: #f4f6fb;
  }
  .outbound pre {
    white-space: pre-wrap;
    word-break: break-word;
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 8px;
    margin: 6px 0 0;
  }
  .receipt + .outbound { margin-left: 16px; }
</style>
</head>
<body>
<header>
  <a href="/admin/pilot/orders"><strong>Panel piloto de pedidos</strong></a>
  {% block crumb %}{% endblock %}
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
